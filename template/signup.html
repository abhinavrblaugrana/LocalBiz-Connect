<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalBiz Connect</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
<main class="login-container">
<section class="auth-container">
    <div class="auth-card">
        <h1>Create Account</h1>
        <p>Register first. Then you can submit service enquiries.</p>

        {% if error %}
            <p class="error-message">{{ error }}</p>
        {% endif %}

        <form method="POST" action="{{ url_for('signup') }}" onsubmit="return validateSignupPassword()">
            <label for="name">Name</label>
            <input id="name" name="name" type="text" placeholder="Enter your name" required>

            <label for="email">Email</label>
            <input id="email" name="email" type="email" placeholder="Enter your email" required>

            <label for="password">Password</label>
            <input id="password" name="password" type="password" placeholder="Minimum 6 characters" required>

            <label for="confirm_password">Confirm Password</label>
            <input id="confirm_password" name="confirm_password" type="password" placeholder="Re-enter password" required>

            <p id="passwordMessage"></p>

            <button class="primary-btn" type="submit">Sign Up</button>
        </form>

        <p class="auth-link">Already registered? <a href="{{ url_for('login') }}">Login here</a></p>
    </div>
</section>
</main>
<script src="{{ url_for('static', filename='script/script.js') }}"></script>
</body>
</html>
