<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>LocalBiz</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header class="top-bar">
      <div class="logo">LocalBiz</div>
      <nav class="navtry">
        <a href="index.html">Home</a>
        <a href="dashboard.html">Dashboard</a>
        <a href="services.html">Services</a>
        <a href="aboutus.html">About Us</a>
        <a href="contact.html">Contact</a>
        <a href="student.html">Profile</a>
      </nav>
    </header>
<main class="contact-container">
  <section class="page-title">
      <h2>Contact Us</h2>
      <p>Send a service query. Later this form will connect to backend and database.</p>
  </section>

  <section class="form-box">

    <form onsubmit="submitEnquiry(event)">

        <label for="name">Name</label>
        <input id="name" type="text" placeholder="Enter your name">

        <label for="email">Email</label>
        <input id="email" type="email" placeholder="Enter your email">

        <label for="service">Service</label>
        <select id="service">
            <option value="">Select a Service</option>
            <option>Website Design</option>
            <option>App Development</option>
            <option>Digital Marketing</option>
            <option>IT Support</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" placeholder="Enter your message"></textarea>

        <button type="submit" class="primary-btn">Submit Enquiry</button>
        <p id="formMessage"></p>

    </form>

  </section>
  </main>
  <footer>
      <p>Form Practice Page - LocalBiz Connect</p>
  </footer>
  <script src="script.js"></script>
  </body>
</html>
