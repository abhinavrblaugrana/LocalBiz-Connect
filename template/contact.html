{% extends "base.html" %}
{% block title %}Contact - LocalBiz Connect{% endblock %}

{% block content %}
<main class="contact-container">
  <section class="page-title">
      <h1>Contact Us</h1>
      <p>
         Have a project in mind? Send us your enquiry and our team
         will get back to you as soon as possible.</p>
  </section>

  <section class="form-box">

    <form method="POST" action="{{ url_for('contact') }}">

        <label for="name">Name</label>
        <input id="name" name="name" type="text" placeholder="Enter your name" required>

        <label for="email">Email</label>
        <input id="email" name="email" type="email" placeholder="Enter your email" required>

        <label for="phone">Phone</label>
        <input id="phone" name="phone" type="tel" placeholder="Enter your phone no." required>

        <label for="service">Service</label>
        <select id="service" name="service" required>
            <option value="">Select a Service</option>
            <option>Website Design</option>
            <option>App Development</option>
            <option>Digital Marketing</option>
            <option>IT Support</option>
        </select>

        <label for="message">Message</label>
        <textarea id="message" name="message" placeholder="Enter your message" required></textarea>

        <button type="submit" class="primary-btn">Submit Enquiry</button>
    </form>
  </section>
  </main>

{% endblock %}

{% block footer %}Contact - LocalBiz Connect{% endblock %}
