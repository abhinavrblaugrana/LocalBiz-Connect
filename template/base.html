<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}LocalBiz Connect{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

<header class="top-bar">
    <div class="logo">LocalBiz</div>

    <nav>
        {% if session.get('user_id') %}
        <a href="{{ url_for('home') }}">Home</a>
        <a href="{{ url_for('dashboard') }}">Dashboard</a>
        <a href="{{ url_for('services') }}">Services</a>
        <a href="{{ url_for('about') }}">About Us</a>
        <a href="{{ url_for('contact') }}">Contact</a>
        <a href="{{ url_for('student_profile') }}">Profile</a>
        <a href="{{ url_for('admin') }}">Admin</a>
        <a class="logout-link" href="{{ url_for('logout') }}">Logout</a>
        {% else %}
            <a href="{{ url_for('login') }}">Login</a>
            <a href="{{ url_for('signup') }}">Sign Up</a>
        {% endif %}
    </nav>
</header>

{% block content %}{% endblock %}

<footer>
    <p>{% block footer %}LocalBiz Connect - Flask + SQLite Version{% endblock %}</p>
</footer>

<script src="{{ url_for('static', filename='script/script.js') }}"></script>
</body>
</html>
